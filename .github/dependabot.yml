# Keeps GitHub Actions, base images and dependencies current. Updates arrive as pull requests, so CI runs on each one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories:
      - "/app"
      - "/platform/gitops"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: helm
    directory: "/charts/shop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
