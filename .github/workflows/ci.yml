name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: helm lint charts/shop
      - name: Validate rendered manifests against the Kubernetes schemas
        run: |
          helm template shop charts/shop -n shop | kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Validate the External Secrets rendering (the generator CRD may have no published schema)
        run: |
          helm template shop charts/shop -n shop --set redisPassword.source=externalSecrets | kubeconform -strict -summary \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Validate the Argo Rollouts rendering
        run: |
          helm template shop charts/shop -n shop --set redisPassword.source=externalSecrets --set rollout.enabled=true | kubeconform -strict -summary \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: Unit-test the SLO alert rules
        run: scripts/test-rules.sh
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile
          ignore: DL3018
      - name: Lint the Git server Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: platform/gitops/Dockerfile
          ignore: DL3018

  scan:
    # Fails the build on HIGH/CRITICAL CVEs that have a fix, misconfigurations, or committed secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t shop-api:dev app
      - name: Scan the image, Dockerfile, chart and repository
        run: scripts/scan.sh all
      - name: Generate the SBOM
        run: scripts/scan.sh sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  e2e:
    # Builds the whole platform on a fresh kind cluster and runs the smoke tests against it,
    # once with the app installed directly by Helm and once with Argo CD deploying it from Git.
    runs-on: ubuntu-latest
    needs: [lint, scan]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [helm, gitops]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the in-cluster Git server is seeded from this repository's history
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Build the platform
        run: |
          if [ "${{ matrix.mode }}" = gitops ]; then export GITOPS=1; fi
          scripts/up.sh
      - name: Smoke tests
        run: scripts/smoke.sh
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n shop describe pods
          kubectl -n shop logs -l app.kubernetes.io/name=shop-api --tail=50
          kubectl -n argocd get applications -o yaml || true
