{{- if and .Values.monitoring.enabled .Values.monitoring.dashboard }}
# Picked up by the Grafana sidecar in kube-prometheus-stack (label grafana_dashboard).
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-dashboard
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  shop.json: |-
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- end }}
