apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # never drop below desired capacity during a rollout
  selector:
    matchLabels: {{- include "shop.api.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "shop.api.selector" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.api.port }}"
    spec:
      serviceAccountName: shop
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000      # the "node" user in the image; numeric so the kubelet can verify it
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Spread replicas over nodes so one node failure does not take the service down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "shop.api.selector" . | nindent 14 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.api.port }} }
          env:
            - { name: PORT, value: "{{ .Values.api.port }}" }
            - { name: PAYMENT_FAILURE_RATE, value: {{ .Values.api.paymentFailureRate | quote }} }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-redis, key: password } }
            - name: REDIS_URL        # $(VAR) is expanded by Kubernetes from the env entry above
              value: "redis://:$(REDIS_PASSWORD)@shop-redis:6379"
          # Startup absorbs a slow boot; liveness only restarts a hung process; readiness gates traffic.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Give the endpoints controller time to remove the pod from the Service before SIGTERM.
            preStop:
              exec: { command: ["sleep", "5"] }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
