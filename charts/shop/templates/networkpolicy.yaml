{{- if .Values.networkPolicy.enabled }}
# Zero trust inside the namespace: deny everything, then allow exactly what is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "shop.api.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:   # the ingress controller (user traffic)
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} }
      ports:
        - { protocol: TCP, port: {{ .Values.api.port }} }
    - from:   # Prometheus (metrics)
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
      ports:
        - { protocol: TCP, port: {{ .Values.api.port }} }
  egress:
    - to:     # the only thing the API may call: its own Redis
        - podSelector:
            matchLabels: {{- include "shop.redis.selector" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 6379 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "shop.redis.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "shop.api.selector" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 6379 }
{{- end }}
