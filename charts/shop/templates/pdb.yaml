# Voluntary disruptions (node drain, upgrades) may never take the last replica away.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shop-api
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "shop.api.selector" . | nindent 6 }}
