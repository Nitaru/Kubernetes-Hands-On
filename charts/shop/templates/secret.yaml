{{- if eq .Values.redisPassword.source "externalSecrets" }}
{{- /* The operator generates the password once (refreshPolicy CreatedOnce) and owns the Secret. Argo CD never sees the value. */ -}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: shop-redis
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  length: 24
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-redis
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: shop-redis
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: shop-redis
{{- else }}
{{- /* Generate the Redis password once and keep it across upgrades (lookup finds the existing one). */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "shop-redis" -}}
apiVersion: v1
kind: Secret
metadata:
  name: shop-redis
  labels: {{- include "shop.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ if $existing }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
