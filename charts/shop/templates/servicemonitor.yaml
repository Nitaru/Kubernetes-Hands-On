{{- if .Values.monitoring.enabled }}
# Needs the Prometheus Operator CRDs (installed by kube-prometheus-stack, see platform/).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shop-api
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "shop.api.selector" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.scrapeInterval }}
{{- end }}
