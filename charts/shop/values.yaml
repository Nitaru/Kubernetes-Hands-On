image:
  repository: shop-api
  tag: dev
  pullPolicy: IfNotPresent   # the image is loaded into kind, never pulled

api:
  replicas: 2                # the HPA takes over once enabled
  port: 3000
  paymentFailureRate: "0.03"
  resources:
    requests: { cpu: 100m, memory: 96Mi }
    limits:   { memory: 192Mi }   # memory limit only: CPU limits cause throttling and hide real load

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60

ingress:
  enabled: true
  className: traefik
  host: shop.localtest.me    # resolves to 127.0.0.1, so no /etc/hosts edit is needed

redis:
  image: redis:8.10-alpine
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { memory: 128Mi }

networkPolicy:
  enabled: true
  ingressNamespace: traefik        # who may call the API
  monitoringNamespace: monitoring  # who may scrape /metrics

monitoring:
  enabled: true            # ServiceMonitor, SLO rules and dashboard; needs kube-prometheus-stack installed first
  dashboard: true
  scrapeInterval: 15s

redisPassword:
  # helm: the chart generates the password itself (randAlphaNum) and keeps it across upgrades with `lookup`.
  #       Works with helm install/upgrade, but not under Argo CD, which renders with `helm template` and cannot look anything up.
  # externalSecrets: the External Secrets Operator generates it once and owns the Secret. Needs the operator and its CRDs installed first
  #       (scripts/up.sh does that for the GitOps install). The chart then ships no password at all, in any form.
  source: helm

rollout:
  # false: a plain Deployment with rolling updates. true: an Argo Rollouts canary with an automatic analysis (needs Argo Rollouts installed,
  # see docs/progressive-delivery.md). The HPA, the PDB and the Service work with either.
  enabled: false
  pauseSeconds: 30
