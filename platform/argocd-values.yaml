# Argo CD, trimmed for kind: no SSO (dex), no notifications, no ApplicationSet controller.
# http://argocd.localtest.me:8080 (user admin, password: make argocd-password)
configs:
  params:
    server.insecure: true        # TLS is not terminated here; Traefik serves plain HTTP on localhost
  cm:
    timeout.reconciliation: 30s  # how often Argo polls Git (default 120s): quicker feedback for demos
    timeout.reconciliation.jitter: 5s
    # Argo calls an Ingress healthy only once it has a load-balancer address. On kind, Traefik is a
    # NodePort and no address is ever assigned, so the app would sit in Progressing forever. A real
    # cluster with a LoadBalancer would not need this.
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "Ingress accepted (kind has no load balancer to wait for)"
      return hs

dex: { enabled: false }
notifications: { enabled: false }
applicationSet: { enabled: false }

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.localtest.me
  resources:
    requests: { cpu: 50m, memory: 128Mi }
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
redis:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
