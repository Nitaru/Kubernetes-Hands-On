# External Secrets Operator, trimmed for kind. It generates the Redis password once (an ExternalSecret with a Password generator) and
# owns the Secret, so Argo CD never has to ignore a field that changes on every render.
installCRDs: true
resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 256Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
certController:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 192Mi }
