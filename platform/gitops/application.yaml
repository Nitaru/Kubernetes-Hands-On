# The one object Argo CD needs: "keep this cluster equal to what is in Git".
# __REPO_URL__ and __REVISION__ are filled in by scripts/up.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __REVISION__
    path: charts/shop
    helm:
      releaseName: shop
      valuesObject:
        # The Redis password is generated by the External Secrets Operator (installed by scripts/up.sh), not by the chart.
        redisPassword:
          source: externalSecrets
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true      # delete what was removed from Git
      selfHeal: true   # undo changes made by hand in the cluster
    syncOptions:
      - CreateNamespace=true
