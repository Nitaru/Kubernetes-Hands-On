apiVersion: v1
kind: Namespace
metadata: { name: gitops }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: git-server, namespace: gitops }
spec:
  replicas: 1
  strategy: { type: Recreate }   # the repo lives in an emptyDir that one pod owns
  selector: { matchLabels: { app: git-server } }
  template:
    metadata: { labels: { app: git-server } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: git
          image: git-server:dev
          imagePullPolicy: IfNotPresent   # loaded into kind, never pulled
          ports: [{ name: git, containerPort: 9418 }]
          readinessProbe: { tcpSocket: { port: git }, periodSeconds: 3 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: repos, mountPath: /repos }]
      volumes: [{ name: repos, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: git-server, namespace: gitops }
spec:
  selector: { app: git-server }
  ports: [{ name: git, port: 9418, targetPort: git }]
