# Prometheus, Alertmanager, Grafana and kube-state-metrics, trimmed to fit a 3-node kind cluster.
# Release name "kps" plus this override gives short service names: kps-prometheus, kps-grafana.
fullnameOverride: kps

prometheus:
  prometheusSpec:
    retention: 2d
    # Pick up every ServiceMonitor and PrometheusRule in the cluster, not only ones labelled for this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits:   { memory: 1Gi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }

grafana:
  # The admin password is generated by the chart; `make grafana-password` prints it.
  sidecar:
    dashboards:
      searchNamespace: ALL
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [grafana.localtest.me]   # http://grafana.localtest.me:8080
  resources:
    requests: { cpu: 50m, memory: 128Mi }

prometheusOperator:
  admissionWebhooks:
    enabled: false          # saves two patch jobs; not needed for a local cluster
  tls:
    enabled: false          # the operator's TLS secret is created by those jobs, so it must go too
  resources:
    requests: { cpu: 20m, memory: 64Mi }

# kind's kubelet serves a self-signed certificate. Same trade-off as metrics-server's --kubelet-insecure-tls.
kubelet:
  serviceMonitor:
    insecureSkipVerify: true

# node-exporter needs host mounts that kind on Docker Desktop cannot share; cAdvisor via the kubelet still
# gives per-pod CPU and memory.
nodeExporter:
  enabled: false

# kind binds these control-plane components to localhost, so their targets would be down and alert forever.
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false }
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeControllerManager: false
    kubeProxy: false
