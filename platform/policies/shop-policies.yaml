# Admission policies for the shop namespace, enforced by Kyverno (CEL-based ValidatingPolicy).
# They encode what the chart already does, so a hand-written or future manifest cannot quietly weaken it.
# Matching Pods is enough: Kyverno autogenerates the equivalent rules for Deployments, StatefulSets, Jobs...
# so a bad Deployment is rejected at `kubectl apply` instead of failing later inside the ReplicaSet.
#
# Trade-off: failurePolicy Fail means that if Kyverno is down, new pods in this namespace are refused.
# That is the secure choice; on a production cluster you would run several replicas of the controller.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: shop-hardened-containers
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: shop }
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: variables.containers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: "Containers must set securityContext.allowPrivilegeEscalation: false."
    - expression: variables.containers.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true)
      message: "Containers must set securityContext.readOnlyRootFilesystem: true (mount an emptyDir where a path must be writable)."
    - expression: variables.containers.all(c, 'ALL' in c.?securityContext.?capabilities.?drop.orValue([]))
      message: "Containers must drop all Linux capabilities (securityContext.capabilities.drop: [ALL])."
    - expression: >-
        object.spec.?securityContext.?runAsNonRoot.orValue(false) == true ||
        variables.containers.all(c, c.?securityContext.?runAsNonRoot.orValue(false) == true)
      message: "Pods must run as non-root (securityContext.runAsNonRoot: true)."
    - expression: >-
        object.spec.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault' ||
        variables.containers.all(c, c.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault')
      message: "Pods must use the RuntimeDefault seccomp profile."
    - expression: object.spec.?hostNetwork.orValue(false) == false && object.spec.?hostPID.orValue(false) == false && object.spec.?hostIPC.orValue(false) == false
      message: "Pods must not use the host network, PID or IPC namespaces."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: shop-pinned-image-tags
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: shop }
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    # The last path segment must carry a tag or a digest, and the tag must not be "latest".
    - expression: >-
        variables.containers.all(c,
          c.image.matches('^([^/]+/)*[^/:@]+[:@][^/]+$') && !c.image.endsWith(':latest'))
      message: "Images must name an explicit tag or digest, and not :latest."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: shop-resource-limits
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: shop }
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    # CPU limits are deliberately not required: they cause throttling (see charts/shop/values.yaml).
    - expression: variables.containers.all(c, has(c.resources) && has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests)
      message: "Containers must set CPU and memory requests."
    - expression: variables.containers.all(c, has(c.resources) && has(c.resources.limits) && 'memory' in c.resources.limits)
      message: "Containers must set a memory limit."
